user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 5m;

  # Cabeceras necesarias para WebSocket (Socket.io).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream taxi_api { server api:4000; }
  upstream taxi_web { server web:3000; }

  server {
    listen 80;
    server_name _;

    # API REST.
    location /api/ {
      proxy_pass http://taxi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck de la API.
    location /health {
      proxy_pass http://taxi_api/health;
    }

    # Socket.io (WebSocket).
    location /socket.io/ {
      proxy_pass http://taxi_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    # Frontend Next.js.
    location / {
      proxy_pass http://taxi_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ===== HTTPS (produccion) =====
  # Tras obtener certificados con certbot, descomenta y ajusta server_name.
  # server {
  #   listen 443 ssl http2;
  #   server_name tu-dominio.com;
  #   ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
  #   # ... mismas location que el bloque :80 ...
  # }
}
